# Traefik Static Configuration
api:
  dashboard: true

# Entry Points Configuration
entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
  # Optional: Additional entry points
  # tcp:
  #   address: ":10000"
  # udp:
  #   address: ":10000/udp"

# Skip certificate verification for backend services
serversTransport:
  insecureSkipVerify: true

# Providers Configuration
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    filename: /config.yml
    watch: true

# Certificate Resolvers
certificatesResolvers:
  cloudflare:
    acme:
      email: your-email@example.com
      storage: acme.json
      # For testing, use staging server (uncomment below, comment out production)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

# Logging Configuration
log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log
